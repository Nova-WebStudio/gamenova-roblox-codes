name: Deploy GameNova to Vercel

# Déclenché à chaque push sur main (jamais sur nova-webstudio)
on:
  push:
    branches:
      - main
  # Optionnel : déploiement automatique chaque jour à 8h pour updater les codes
  schedule:
    - cron: '0 8 * * *'
  # Permet de lancer manuellement depuis GitHub Actions
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel (GameNova only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (GameNova project)
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=nova-webstudios-projects
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project (generates .vercel/output with all assets)
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=nova-webstudios-projects
        env:
          VERCEL_ORG_ID:     ${{ sec