name: 🚀 Deploy Zoneblox → Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload vers Hostinger via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Télécharger le code
        uses: actions/checkout@v4

      - name: 📤 Déployer sur Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:       ${{ secrets.FTP_HOST }}
          username:     ${{ secrets.FTP_USER }}
          password:     ${{ secrets.FTP_PASS }}
          port:         21
          protocol:     ftp
          timeout:      600000
          local-dir:    ./
          server-dir:   /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.vercel/**
            **/node_modules/**
            **/.github/**
            **/deploy.bat
            **/deploy.ps1
            **/*.md
            **/_TEMPLATE.html
