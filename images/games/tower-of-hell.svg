<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#b71c1c"/><stop offset="100%" stop-color="#1a0000"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="50%"><stop offset="0%" stop-color="#ff1744" stop-opacity=".4"/><stop offset="100%" stop-color="#ff1744" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="160" rx="150" ry="70" fill="url(#glow)"/>
  <!-- Tower blocks -->
  <rect x="170" y="130" width="60" height="30" rx="3" fill="#e53935"/>
  <rect x="178" y="100" width="44" height="32" rx="3" fill="#ef5350"/>
  <rect x="185" y="72" width="30" height="30" rx="3" fill="#f44336"/>
  <rect x="190" y="46" width="20" height="28" rx="3" fill="#ef5350"/>
  <rect x="193" y="24" width="14" height="24" rx="3" fill="#e53935"/>
  <!-- Platform highlight lines -->
  <line x1="170" y1="133" x2="230" y2="133" stroke="#ff8a80" stroke-width="2" opacity=".5"/>
  <line x1="178" y1="103" x2="222" y2="103" stroke="#ff8a80" stroke-width="2" opacity=".5"/>
  <line x1="185" y1="75" x2="215" y2="75" stroke="#ff8a80" stroke-width="2" opacity=".5"/>
  <line x1="190" y1="49" x2="210" y2="49" stroke="#ff8a80" stroke-width="2" opacity=".5"/>
  <!-- Tiny player on top -->
  <rect x="196" y="17" width="8" height="8" rx="2" fill="white"/>
  <circle cx="200" cy="13" r="4" fill="#ffcc80"/>
  <!-- Lava at bottom -->
  <rect x="0" y="158" width="400" height="17" fill="#ff6d00" opacity=".7"/>
  <ellipse cx="100" cy="158" rx="40" ry="8" fill="#ff3d00" opacity=".5"/>
  <ellipse cx="300" cy="158" rx="40" ry="8" fill="#ff3d00" opacity=".5"/>
  <!-- Flame shapes -->
  <polygon points="80,158 90,135 100,158" fill="#ff6d00" opacity=".6"/>
  <polygon points="200,158 210,142 220,158" fill="#ff6d00" opacity=".6"/>
  <polygon points="310,158 320,138 330,158" fill="#ff6d00" opacity=".6"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">TOWER OF HELL</text>
</svg>