<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#880011"/><stop offset="100%" stop-color="#1a0010"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#ff0044" stop-opacity=".4"/><stop offset="100%" stop-color="#ff0044" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="130" ry="85" fill="url(#glow)"/>
  <!-- VS text big -->
  <text x="200" y="120" font-size="72" font-weight="900" text-anchor="middle" font-family="Arial Black,sans-serif" fill="#ff1a44" letter-spacing="-3" opacity=".9">VS</text>
  <text x="200" y="120" font-size="72" font-weight="900" text-anchor="middle" font-family="Arial Black,sans-serif" fill="none" stroke="white" stroke-width="1.5" letter-spacing="-3" opacity=".4">VS</text>
  <!-- Crosshair left -->
  <circle cx="100" cy="90" r="22" fill="none" stroke="#ff6688" stroke-width="3"/>
  <line x1="78" y1="90" x2="122" y2="90" stroke="#ff6688" stroke-width="2"/>
  <line x1="100" y1="68" x2="100" y2="112" stroke="#ff6688" stroke-width="2"/>
  <circle cx="100" cy="90" r="5" fill="#ff6688"/>
  <!-- Crosshair right -->
  <circle cx="300" cy="90" r="22" fill="none" stroke="#44aaff" stroke-width="3"/>
  <line x1="278" y1="90" x2="322" y2="90" stroke="#44aaff" stroke-width="2"/>
  <line x1="300" y1="68" x2="300" y2="112" stroke="#44aaff" stroke-width="2"/>
  <circle cx="300" cy="90" r="5" fill="#44aaff"/>
  <!-- Trophy top -->
  <rect x="185" y="28" width="30" height="22" rx="4" fill="#ffd700"/>
  <ellipse cx="200" cy="28" rx="18" ry="10" fill="#ffd700"/>
  <rect x="193" y="48" width="14" height="10" rx="2" fill="#b8860b"/>
  <rect x="187" y="57" width="26" height="5" rx="2" fill="#ffd700"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">RIVALS</text>
</svg>