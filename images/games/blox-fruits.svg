<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#1a0500"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#ff6b35" stop-opacity=".5"/><stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="130" ry="90" fill="url(#glow)"/>
  <!-- Fruit -->
  <circle cx="200" cy="95" r="52" fill="#ff4500" opacity=".95"/>
  <circle cx="200" cy="95" r="52" fill="none" stroke="#ff8c00" stroke-width="3"/>
  <ellipse cx="200" cy="95" rx="18" ry="30" fill="#e63900" opacity=".5"/>
  <!-- Leaf on top -->
  <ellipse cx="200" cy="45" rx="10" ry="18" fill="#00c853" transform="rotate(-20 200 45)"/>
  <ellipse cx="212" cy="42" rx="8" ry="16" fill="#00e676" transform="rotate(15 212 42)"/>
  <!-- Shine -->
  <ellipse cx="184" cy="78" rx="10" ry="7" fill="white" opacity=".25" transform="rotate(-30 184 78)"/>
  <!-- Sword -->
  <line x1="245" y1="55" x2="290" y2="10" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
  <line x1="255" y1="52" x2="248" y2="72" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.6)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">BLOX FRUITS</text>
</svg>