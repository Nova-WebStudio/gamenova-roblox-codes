<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b8860b"/><stop offset="100%" stop-color="#1a0e00"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#ffd700" stop-opacity=".4"/><stop offset="100%" stop-color="#ffd700" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="130" ry="85" fill="url(#glow)"/>
  <!-- Crown -->
  <polygon points="130,140 145,80 175,110 200,65 225,110 255,80 270,140" fill="#ffd700" stroke="#ff8c00" stroke-width="2"/>
  <!-- Crown gems -->
  <circle cx="200" cy="73" r="10" fill="#cc0000"/>
  <circle cx="200" cy="73" r="6" fill="#ff4444"/>
  <circle cx="148" cy="87" r="7" fill="#0044cc"/>
  <circle cx="148" cy="87" r="4" fill="#4488ff"/>
  <circle cx="252" cy="87" r="7" fill="#00cc44"/>
  <circle cx="252" cy="87" r="4" fill="#44ff88"/>
  <!-- Crown base -->
  <rect x="130" y="138" width="140" height="18" rx="4" fill="#ffc200" stroke="#ff8c00" stroke-width="1"/>
  <!-- Lightning bolt -->
  <polygon points="215,40 205,70 215,65 205,95 220,58 208,62" fill="#fff176" stroke="#ffd700" stroke-width="1"/>
  <!-- Stars -->
  <text x="85" y="70" font-size="20" text-anchor="middle" font-family="serif" fill="#ffd700" opacity=".8">✦</text>
  <text x="315" y="65" font-size="16" text-anchor="middle" font-family="serif" fill="#ffd700" opacity=".7">✦</text>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.6)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">KING LEGACY</text>
</svg>