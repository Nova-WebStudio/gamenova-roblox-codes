<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#660000"/><stop offset="100%" stop-color="#0d0000"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%"><stop offset="0%" stop-color="#ff0000" stop-opacity=".3"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="120" ry="85" fill="url(#glow)"/>
  <!-- Knife -->
  <rect x="188" y="35" width="24" height="90" rx="4" fill="#aaa" stroke="#888" stroke-width="1"/>
  <polygon points="188,35 212,35 200,8" fill="#ccc" stroke="#999" stroke-width="1"/>
  <!-- Knife handle -->
  <rect x="185" y="123" width="30" height="35" rx="5" fill="#5c3317" stroke="#3e2009" stroke-width="1.5"/>
  <rect x="183" y="120" width="34" height="8" rx="3" fill="#8B6914"/>
  <!-- Blood drip -->
  <ellipse cx="200" cy="55" rx="5" ry="8" fill="#cc0000" opacity=".7"/>
  <ellipse cx="194" cy="68" rx="3" ry="5" fill="#cc0000" opacity=".6"/>
  <!-- Detective hat -->
  <ellipse cx="130" cy="95" rx="30" ry="10" fill="#222"/>
  <rect x="110" y="65" width="40" height="32" rx="6" fill="#333"/>
  <!-- Badge -->
  <polygon points="310,70 316,85 333,85 320,95 325,112 310,102 295,112 300,95 287,85 304,85" fill="#ffd700" opacity=".9"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.7)"/>
  <text x="200" y="200" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".3">MURDER MYSTERY 2</text>
</svg>