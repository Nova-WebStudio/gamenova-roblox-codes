<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#004d1a"/><stop offset="100%" stop-color="#000d08"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#00ff88" stop-opacity=".35"/><stop offset="100%" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="120" ry="85" fill="url(#glow)"/>
  <!-- Alien/monster face -->
  <ellipse cx="200" cy="90" rx="52" ry="60" fill="#004d1a"/>
  <ellipse cx="200" cy="90" rx="48" ry="56" fill="#006622"/>
  <!-- Big glowing eyes -->
  <ellipse cx="182" cy="78" rx="16" ry="18" fill="#00ff88"/>
  <ellipse cx="218" cy="78" rx="16" ry="18" fill="#00ff88"/>
  <ellipse cx="182" cy="78" rx="10" ry="12" fill="#003311"/>
  <ellipse cx="218" cy="78" rx="10" ry="12" fill="#003311"/>
  <ellipse cx="183" cy="75" rx="4" ry="4" fill="#00ff88" opacity=".7"/>
  <ellipse cx="219" cy="75" rx="4" ry="4" fill="#00ff88" opacity=".7"/>
  <!-- Mouth with teeth -->
  <path d="M175 108 Q200 128 225 108" fill="#003311" stroke="#00ff88" stroke-width="2"/>
  <line x1="185" y1="110" x2="185" y2="122" stroke="white" stroke-width="2"/>
  <line x1="195" y1="113" x2="195" y2="125" stroke="white" stroke-width="2"/>
  <line x1="205" y1="113" x2="205" y2="125" stroke="white" stroke-width="2"/>
  <line x1="215" y1="110" x2="215" y2="122" stroke="white" stroke-width="2"/>
  <!-- Antennae -->
  <line x1="185" y1="32" x2="178" y2="8" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  <circle cx="178" cy="8" r="5" fill="#00ff88"/>
  <line x1="215" y1="32" x2="222" y2="8" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  <circle cx="222" cy="8" r="5" fill="#00ff88"/>
  <!-- Glow rings -->
  <circle cx="200" cy="90" r="65" fill="none" stroke="#00ff88" stroke-width="1" opacity=".2"/>
  <circle cx="200" cy="90" r="80" fill="none" stroke="#00ff88" stroke-width="1" opacity=".1"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">ENCOUNTERS</text>
</svg>