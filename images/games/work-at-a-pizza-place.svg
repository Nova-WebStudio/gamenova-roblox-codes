<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d84315"/><stop offset="100%" stop-color="#1a0a00"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#ffcc00" stop-opacity=".4"/><stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="130" ry="80" fill="url(#glow)"/>
  <!-- Pizza big circle -->
  <circle cx="200" cy="92" r="65" fill="#f57f17"/>
  <circle cx="200" cy="92" r="60" fill="#ff8f00"/>
  <!-- Cheese layer -->
  <circle cx="200" cy="92" r="50" fill="#ffd740"/>
  <!-- Tomato sauce visible at edge -->
  <circle cx="200" cy="92" r="55" fill="none" stroke="#e53935" stroke-width="6"/>
  <!-- Toppings: pepperoni -->
  <circle cx="188" cy="78" r="9" fill="#c62828"/>
  <circle cx="188" cy="78" r="6" fill="#d32f2f"/>
  <circle cx="214" cy="82" r="8" fill="#c62828"/>
  <circle cx="214" cy="82" r="5" fill="#d32f2f"/>
  <circle cx="195" cy="105" r="9" fill="#c62828"/>
  <circle cx="195" cy="105" r="6" fill="#d32f2f"/>
  <circle cx="218" cy="107" r="7" fill="#c62828"/>
  <circle cx="218" cy="107" r="4.5" fill="#d32f2f"/>
  <circle cx="175" cy="98" r="7" fill="#c62828"/>
  <circle cx="175" cy="98" r="4.5" fill="#d32f2f"/>
  <!-- Slice cut lines -->
  <line x1="200" y1="30" x2="200" y2="155" stroke="#e65100" stroke-width="2" opacity=".4"/>
  <line x1="144" y1="59" x2="256" y2="125" stroke="#e65100" stroke-width="2" opacity=".4"/>
  <line x1="144" y1="125" x2="256" y2="59" stroke="#e65100" stroke-width="2" opacity=".4"/>
  <!-- Chef hat -->
  <rect x="286" y="88" width="36" height="24" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="304" cy="86" rx="22" ry="18" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="200" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".2">WORK AT A PIZZA PLACE</text>
</svg>