<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2c0080"/><stop offset="100%" stop-color="#0a0020"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a259ff" stop-opacity=".5"/><stop offset="100%" stop-color="#a259ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="130" ry="90" fill="url(#glow)"/>
  <!-- Sharingan eye -->
  <circle cx="200" cy="90" r="55" fill="#cc0000" stroke="#ff2200" stroke-width="2"/>
  <circle cx="200" cy="90" r="38" fill="#0a0020"/>
  <circle cx="200" cy="90" r="15" fill="#cc0000"/>
  <!-- 3 tomoe -->
  <circle cx="200" cy="58" r="7" fill="#cc0000"/>
  <circle cx="197" cy="56" r="4" fill="#0a0020"/>
  <circle cx="228" cy="107" r="7" fill="#cc0000"/>
  <circle cx="228" cy="110" r="4" fill="#0a0020"/>
  <circle cx="172" cy="107" r="7" fill="#cc0000"/>
  <circle cx="172" cy="110" r="4" fill="#0a0020"/>
  <!-- Glow ring -->
  <circle cx="200" cy="90" r="55" fill="none" stroke="#ff6600" stroke-width="2" opacity=".5"/>
  <!-- Kunai shapes -->
  <line x1="110" y1="40" x2="135" y2="70" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="110,40 106,30 120,38" fill="#ddd"/>
  <line x1="290" y1="40" x2="265" y2="70" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="290,40 294,30 280,38" fill="#ddd"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">SHINDO LIFE</text>
</svg>