<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c0080;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0020;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#bg)"/>

  <!-- Glow blob -->
  <ellipse cx="200" cy="110" rx="160" ry="100" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid lines décoratives -->
  <g stroke="#6b35ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="44" x2="400" y2="44"/>
    <line x1="0" y1="88" x2="400" y2="88"/>
    <line x1="0" y1="132" x2="400" y2="132"/>
    <line x1="0" y1="176" x2="400" y2="176"/>
    <line x1="80" y1="0" x2="80" y2="220"/>
    <line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="320" y1="0" x2="320" y2="220"/>
  </g>

  <!-- Accent corner top-left -->
  <rect x="0" y="0" width="4" height="60" fill="#6b35ff" opacity="0.9" rx="2"/>
  <rect x="0" y="0" width="60" height="4" fill="#6b35ff" opacity="0.9" rx="2"/>

  <!-- Accent corner bottom-right -->
  <rect x="396" y="160" width="4" height="60" fill="#6b35ff" opacity="0.6" rx="2"/>
  <rect x="340" y="216" width="60" height="4" fill="#6b35ff" opacity="0.6" rx="2"/>

  <!-- Emoji icon -->
  <text x="200" y="115" font-size="72" text-anchor="middle" dominant-baseline="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
        opacity="0.92">🌀</text>

  <!-- Game name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,0.55)"/>
  <text x="200" y="203" font-size="18" font-weight="bold" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" fill="white" letter-spacing="0.3">Shindo Life</text>
</svg>