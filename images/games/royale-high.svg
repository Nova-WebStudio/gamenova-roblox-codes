<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#880e4f"/><stop offset="100%" stop-color="#1a0010"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#f48fb1" stop-opacity=".5"/><stop offset="100%" stop-color="#f48fb1" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="90" rx="140" ry="90" fill="url(#glow)"/>
  <!-- Big crown -->
  <polygon points="120,155 140,85 175,120 200,70 225,120 260,85 280,155" fill="#ffd700" stroke="#ff8f00" stroke-width="2"/>
  <!-- Crown base -->
  <rect x="120" y="153" width="160" height="16" rx="5" fill="#ffc107" stroke="#ff8f00" stroke-width="1"/>
  <!-- Crown gems -->
  <circle cx="200" cy="78" r="13" fill="#e91e63"/>
  <circle cx="200" cy="78" r="8" fill="#f48fb1"/>
  <circle cx="144" cy="93" r="9" fill="#7b1fa2"/>
  <circle cx="144" cy="93" r="5" fill="#ce93d8"/>
  <circle cx="256" cy="93" r="9" fill="#1565c0"/>
  <circle cx="256" cy="93" r="5" fill="#90caf9"/>
  <!-- Sparkles / stars -->
  <text x="90" y="65" font-size="22" text-anchor="middle" font-family="serif" fill="#ffd700">✦</text>
  <text x="310" y="60" font-size="18" text-anchor="middle" font-family="serif" fill="#ffd700">✦</text>
  <text x="330" y="130" font-size="14" text-anchor="middle" font-family="serif" fill="#f48fb1">✦</text>
  <text x="70" y="140" font-size="16" text-anchor="middle" font-family="serif" fill="#f48fb1">✦</text>
  <!-- Wings hint -->
  <path d="M100,130 Q70,100 90,75 Q110,90 120,115" fill="#f48fb1" opacity=".4"/>
  <path d="M300,130 Q330,100 310,75 Q290,90 280,115" fill="#f48fb1" opacity=".4"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">ROYALE HIGH</text>
</svg>