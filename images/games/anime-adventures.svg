<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#003566"/><stop offset="100%" stop-color="#000d1a"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#00cfff" stop-opacity=".4"/><stop offset="100%" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="130" ry="85" fill="url(#glow)"/>
  <!-- Anime character silhouette - spiky hair -->
  <ellipse cx="200" cy="85" rx="30" ry="28" fill="#4a90d9"/>
  <!-- Spiky hair -->
  <polygon points="185,62 175,35 195,60" fill="#3a7bc8"/>
  <polygon points="195,58 188,28 205,56" fill="#4a90d9"/>
  <polygon points="205,58 210,30 215,58" fill="#3a7bc8"/>
  <polygon points="215,62 225,38 218,63" fill="#4a90d9"/>
  <!-- Eyes glow -->
  <ellipse cx="191" cy="83" rx="6" ry="7" fill="white"/>
  <ellipse cx="209" cy="83" rx="6" ry="7" fill="white"/>
  <ellipse cx="191" cy="84" rx="4" ry="5" fill="#00cfff"/>
  <ellipse cx="209" cy="84" rx="4" ry="5" fill="#00cfff"/>
  <!-- Body -->
  <rect x="178" y="112" width="44" height="45" rx="8" fill="#2c5f8a"/>
  <!-- Energy aura -->
  <ellipse cx="200" cy="100" rx="55" ry="60" fill="none" stroke="#00cfff" stroke-width="2" opacity=".3"/>
  <ellipse cx="200" cy="100" rx="65" ry="70" fill="none" stroke="#00cfff" stroke-width="1" opacity=".15"/>
  <!-- Sword -->
  <line x1="240" y1="45" x2="300" y2="130" stroke="#00cfff" stroke-width="4" stroke-linecap="round"/>
  <line x1="248" y1="53" x2="238" y2="68" stroke="#4dd0e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="3" fill="#ffd700" opacity=".8"/>
  <circle cx="310" cy="50" r="4" fill="#ffd700" opacity=".7"/>
  <circle cx="330" cy="140" r="3" fill="#ffd700" opacity=".6"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="200" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".3">ANIME ADVENTURES</text>
</svg>