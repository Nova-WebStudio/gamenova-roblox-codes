<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e65100"/><stop offset="100%" stop-color="#1a0d00"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#ffcc00" stop-opacity=".4"/><stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="95" rx="130" ry="85" fill="url(#glow)"/>
  <!-- Explosion -->
  <polygon points="200,20 215,60 255,45 230,75 270,85 235,100 255,135 215,115 210,160 190,120 150,140 165,105 130,95 165,85 140,55 180,70" fill="#ffcc00" stroke="#ff8c00" stroke-width="2"/>
  <polygon points="200,38 211,65 242,54 223,77 253,85 225,97 241,123 212,107 208,145 193,112 160,128 170,102 145,93 172,85 153,62 183,73" fill="#ffa500"/>
  <!-- Center glow -->
  <circle cx="200" cy="90" r="22" fill="white" opacity=".15"/>
  <!-- Fist -->
  <rect x="182" y="76" width="36" height="28" rx="8" fill="#ff7043"/>
  <rect x="182" y="76" width="36" height="10" rx="4" fill="#ef5350"/>
  <!-- Speed lines -->
  <line x1="100" y1="50" x2="145" y2="70" stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <line x1="95" y1="90" x2="145" y2="90" stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <line x1="300" y1="55" x2="255" y2="72" stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.6)"/>
  <text x="200" y="200" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".3">FRUIT BATTLEGROUNDS</text>
</svg>