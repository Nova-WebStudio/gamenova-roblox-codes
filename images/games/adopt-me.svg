<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0077b6"/><stop offset="100%" stop-color="#001a2e"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0%" stop-color="#00cfff" stop-opacity=".35"/><stop offset="100%" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="130" ry="85" fill="url(#glow)"/>
  <!-- Egg shape -->
  <ellipse cx="200" cy="100" rx="50" ry="60" fill="#fffde7" stroke="#ffd54f" stroke-width="3"/>
  <path d="M150 115 Q175 85 200 95 Q225 105 250 115" fill="none" stroke="#ffcc02" stroke-width="14" stroke-linecap="round"/>
  <!-- Baby bird hatching -->
  <circle cx="200" cy="72" r="22" fill="#ffeb3b"/>
  <!-- Wings -->
  <ellipse cx="178" cy="77" rx="14" ry="10" fill="#ffc107" transform="rotate(-20 178 77)"/>
  <ellipse cx="222" cy="77" rx="14" ry="10" fill="#ffc107" transform="rotate(20 222 77)"/>
  <!-- Eyes -->
  <circle cx="193" cy="68" r="5" fill="#333"/>
  <circle cx="207" cy="68" r="5" fill="#333"/>
  <circle cx="194" cy="67" r="1.5" fill="white"/>
  <circle cx="208" cy="67" r="1.5" fill="white"/>
  <!-- Beak -->
  <polygon points="200,73 195,79 205,79" fill="#ff8f00"/>
  <!-- Stars around -->
  <circle cx="100" cy="60" r="5" fill="#ffd700" opacity=".8"/>
  <circle cx="300" cy="55" r="4" fill="#ffd700" opacity=".7"/>
  <circle cx="320" cy="120" r="6" fill="#00cfff" opacity=".6"/>
  <circle cx="80" cy="130" r="4" fill="#00cfff" opacity=".6"/>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.6)"/>
  <text x="200" y="203" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">ADOPT ME!</text>
</svg>