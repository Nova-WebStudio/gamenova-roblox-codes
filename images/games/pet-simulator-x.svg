<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6a0dad"/><stop offset="100%" stop-color="#12003a"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff6bdc" stop-opacity=".4"/><stop offset="100%" stop-color="#ff6bdc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="140" ry="90" fill="url(#glow)"/>
  <!-- Cat body -->
  <ellipse cx="200" cy="120" rx="55" ry="45" fill="#ff9bdc"/>
  <!-- Cat head -->
  <circle cx="200" cy="78" r="42" fill="#ffb3e6"/>
  <!-- Ears -->
  <polygon points="165,50 155,22 185,44" fill="#ff9bdc"/>
  <polygon points="235,50 245,22 215,44" fill="#ff9bdc"/>
  <polygon points="167,48 160,28 183,44" fill="#ff6bdc"/>
  <polygon points="233,48 240,28 217,44" fill="#ff6bdc"/>
  <!-- Eyes -->
  <circle cx="186" cy="75" r="9" fill="white"/>
  <circle cx="214" cy="75" r="9" fill="white"/>
  <circle cx="188" cy="76" r="5" fill="#6a0dad"/>
  <circle cx="216" cy="76" r="5" fill="#6a0dad"/>
  <circle cx="189" cy="74" r="2" fill="white"/>
  <circle cx="217" cy="74" r="2" fill="white"/>
  <!-- Nose & mouth -->
  <ellipse cx="200" cy="88" rx="4" ry="3" fill="#ff69b4"/>
  <path d="M193 93 Q200 99 207 93" fill="none" stroke="#cc5599" stroke-width="2"/>
  <!-- Stars -->
  <text x="80" y="75" font-size="28" text-anchor="middle" font-family="Arial" fill="#ffd700" opacity=".9">★</text>
  <text x="320" y="90" font-size="22" text-anchor="middle" font-family="Arial" fill="#ffd700" opacity=".8">★</text>
  <text x="290" y="50" font-size="16" text-anchor="middle" font-family="Arial" fill="#ffd700" opacity=".7">★</text>
  <!-- Name bar -->
  <rect x="0" y="175" width="400" height="45" fill="rgba(0,0,0,.65)"/>
  <text x="200" y="203" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" fill="white" letter-spacing=".5">PET SIMULATOR X</text>
</svg>